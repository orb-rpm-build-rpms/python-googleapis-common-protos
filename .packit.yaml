upstream_package_name: python-api-common-protos
downstream_package_name: python-googleapis-common-protos

upstream_project_url: https://github.com/googleapis/python-api-common-protos/
upstream_tag_template: v{version}

specfile_path: python-googleapis-common-protos.spec

jobs:
  - job: propose_downstream
    trigger: release
    dist_git_branches:
      - fedora-all

  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      - fedora-all

  - job: koji_build
    trigger: commit
    dist_git_branches:
      - fedora-all
    allowed_pr_authors:
      - packit
      - mhayden
    allowed_committers:
      - packit
      - mhayden

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched
